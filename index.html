</div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

}

// Convex hull of screen points.
function bxHull(points) {
  const s = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (s.length < 3) return s;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of s) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = s.length - 1; i >= 0; i--) { const p = s[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return [...lo.slice(0, -1), ...up.slice(0, -1)];
}

// A convex prism whose profile lies in the x-z plane, extruded along y from y0 to y1.
// Returns kit SolidPaths, shaded by facing with the kit's light, for solidSvg.
function bxPrismY(poly, y0, y1, P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  const V = [cosA * cosE, sinA * cosE, sinE];
  let area = 0;
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; area += a[0] * b[1] - b[0] * a[1]; }
  const ring = area < 0 ? [...poly].reverse() : poly;
  const n = ring.length;
  const F = ring.map(([x, z]) => iso([x, y1, z], P));
  const B = ring.map(([x, z]) => iso([x, y0, z], P));
  const shades = [[], [], [], []];
  const tops = [];
  const vis = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ring[j][0] - ring[i][0], dz = ring[j][1] - ring[i][1];
    const len = Math.hypot(dx, dz) || 1;
    const nx = dz / len, nz = -dx / len;
    vis[i] = nx * V[0] + nz * V[2] > 1e-6;
    if (!vis[i]) continue;
    const quad = pathOf([F[i], F[j], B[j], B[i]], true);
    if (nz > 0.55) tops.push(quad);
    else {
      const lit = (nx * -sinA * Math.sqrt(1 - nz * nz) + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(lit * 4 - (nz < -0.3 ? 1 : 0))))].push(quad);
    }
  }
  const capFront = V[1] > 0;
  const cap = capFront ? F : B;
  const capLit = ((capFront ? cosA : -cosA) + 1) / 2;
  shades[Math.min(3, Math.max(0, Math.floor(capLit * 4)))].push(pathOf(cap, true));
  const crease = [pathOf([...cap, cap[0]])];
  for (let i = 0; i < n; i++) if (vis[(i + n - 1) % n] && vis[i]) crease.push(pathOf([F[i], B[i]]));
  const hull = bxHull([...F, ...B]);
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: crease.join(""), top: tops.join(""), shades: shades.map((list) => list.join("")) };
}

function bxCircle(cx, cz, r, steps = 28) {
  return Array.from({ length: steps }, (_, i) => [cx + r * Math.cos((i / steps) * Math.PI * 2), cz + r * Math.sin((i / steps) * Math.PI * 2)]);
}

// A round rod between two world points, drawn as a shaded ribbon with a round far cap.
function bxRod(a, b, r, P) {
  const A = iso(a, P), B = iso(b, P);
  const k = cameraOf(P).k;
  const rs = r * k * 0.82;
  let dx = B[0] - A[0], dy = B[1] - A[1];
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const nx = -dy, ny = dx;
  const off = (P0, s, t = 0) => [P0[0] + nx * rs * s + dx * rs * t, P0[1] + ny * rs * s + dy * rs * t];
  const cap = (P0, sign) => Array.from({ length: 9 }, (_, i) => { const t = (i / 8) * Math.PI; return off(P0, Math.cos(t) * sign, Math.sin(t) * 0.55 * sign); });
  const body = [off(A, 1), ...cap(B, 1), off(A, -1)];
  const up = ny < 0 ? 1 : -1; // the side facing screen-up catches the light
  const shine = [off(A, up * 0.15), off(B, up * 0.15), off(B, up * 0.6), off(A, up * 0.6)];
  const shade = [off(A, -up * 0.55), off(B, -up * 0.55), off(B, -up * 1), off(A, -up * 1)];
  const outline = pathOf([off(A, 1), ...cap(B, 1), off(A, -1)]);
  return { fill: pathOf(body, true), outline, crease: "", top: pathOf(shine, true), shades: [pathOf(shade, true), "", "", ""] };
}

// A curved flat band (e.g. a stamped pedal arm): the profile is the strip between two
// polylines in the x-z plane, extruded along y. Unlike bxPrismY it need not be convex,
// and it draws one continuous silhouette, so the curve shows no segment seams.
function bxBandY(left, right, y0, y1, P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  const V = [cosA * cosE, sinA * cosE, sinE];
  let ring = [...left, ...[...right].reverse()];
  let area = 0;
  for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; area += a[0] * b[1] - b[0] * a[1]; }
  if (area < 0) ring = ring.reverse();
  const n = ring.length;
  const capFront = V[1] > 0;
  const Fr = ring.map(([x, z]) => iso([x, capFront ? y1 : y0, z], P));
  const Bk = ring.map(([x, z]) => iso([x, capFront ? y0 : y1, z], P));
  const ccw = (pts) => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s < 0 ? [...pts].reverse() : pts; };
  const shades = [[], [], [], []], tops = [], vis = [], fills = [pathOf(ccw(Fr), true), pathOf(ccw(Bk), true)];
  const outline = [], crease = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ring[j][0] - ring[i][0], dz = ring[j][1] - ring[i][1];
    const len = Math.hypot(dx, dz) || 1;
    const nx = dz / len, nz = -dx / len;
    vis[i] = nx * V[0] + nz * V[2] > 1e-6;
    if (!vis[i]) { outline.push(pathOf([Fr[i], Fr[j]])); continue; }
    const quad = [Fr[i], Fr[j], Bk[j], Bk[i]];
    fills.push(pathOf(ccw(quad), true));
    if (nz > 0.55) tops.push(pathOf(quad, true));
    else {
      const lit = (nx * -sinA * Math.sqrt(1 - nz * nz) + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(lit * 4 - (nz < -0.3 ? 1 : 0))))].push(pathOf(quad, true));
    }
    outline.push(pathOf([Bk[i], Bk[j]]));
    crease.push(pathOf([Fr[i], Fr[j]]));
  }
  for (let i = 0; i < n; i++) if (vis[(i + n - 1) % n] !== vis[i]) outline.push(pathOf([Fr[i], Bk[i]]));
  const capLit = ((capFront ? cosA : -cosA) + 1) / 2;
  shades[Math.min(3, Math.max(0, Math.floor(capLit * 4)))].push(pathOf(Fr, true));

  const dl = phi - PHI0, c = Math.cos(dl), s = Math.sin(dl);

  out.push(pr(bxCircle(0, 0, 8, 28), -6, 6, { tone: "hi", crease: "lo" }));
  out.push(pr(bxCircle(CLV[0], CLV[1], 6.5, 20), 5, 8, { tone: "mid" }));
  out.push(pr(bxCircle(CLV[0], CLV[1], 2.6, 16), 8, 9.6, { tone: "mid" }));

  out.push(pr(box(-13, 13, -2, 3), -16, 16, { tone: "mid" }));

const still = matchMedia("(prefers-reduced-motion: reduce)");

const sstep = (a, b, x) => { const t = lim((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (cur, target, dt, tau) => (still.matches ? target : cur + (target - cur) * (1 - Math.exp(-dt / tau)));
const el = {
  asm: $('[data-part="asm"]'), reg: $('[data-part="reg"]'), booster: $('[data-part="booster"]'), arm: $('[data-part="arm"]'), rod: $('[data-part="rod"]'),
  top: $('[data-part="top"]'), crack: $('[data-part="crack"]'), crack2: $('[data-part="crack2"]'), needle: $('[data-part="needle"]'), marker: $('[data-part="marker"]'),
  card: $('[data-part="card"]'), paper: $('[data-part="paper"]'), led: $('[data-part="led"]'), l1: $('[data-part="l1"]'), l2: $('[data-part="l2"]'),
};
const groups = [...svgEl.querySelectorAll("[data-g]")];
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const PAY_TEXT = "尊享刹车体验 · ¥1,000,000", PAID_TEXT = "已支付 ¥1,000,000";

// ---- state ----
const S0 = () => ({ phase: "pay", payT: 0, F: 0, Ft: 0, peak: 0, crack: 0, broken: false, drop: 0, dropV: 0, dist: 38, ex: 0, exT: 0, shares: [0, 0, 0, 0, 0, 0] });
let st = S0();
let variant = "thin";
let frozen = false;
const V = () => DATA.VARIANTS[variant];

// ---- URL presets for screenshots: ?state=pay|paying|brake|cracked|broken|exploded&f=500&v=thick&t=1.4&demo=0 ----
const q = new URLSearchParams(location.search);
// The idle demo never pays: it only starts after the visitor has paid once, and only replays the pedal act.
let demo = q.get("demo") === "1";
let userPaid = demo;
if (q.get("v") === "thick") variant = "thick";
function applyPreset() {
  const s = q.get("state");
  if (!s) return;
  const f = q.has("f") ? +q.get("f") : null;
  if (s === "paying") { st.phase = "paying"; st.payT = q.has("t") ? +q.get("t") : 1.6; frozen = true; return; }
  if (s === "pay") return;
  st.phase = "brake"; st.payT = 9;
  st.F = st.Ft = f ?? 0;
  if (s === "cracked") { variant = q.get("v") === "thick" ? "thick" : "thin"; st.F = st.Ft = f ?? 1580; st.crack = lim((st.F - V().crack) / (V().fail - V().crack), 0, 0.97); }
  if (s === "broken") { st.broken = true; st.crack = 1; st.drop = 1; st.peak = Math.max(f ?? 1612, 1612); st.F = st.Ft = 0; st.dist = 140; }
  if (s === "exploded") { st.ex = st.exT = 1; st.shares = st.shares.map(() => 1); }
  st.peak = Math.max(st.peak, st.F);
}
applyPreset();

// ---- geometry helpers ----
const pressOf = (F) => 0.24 * (1 - Math.exp(-F / 350));
const shareAt = (i) => st.shares[i];
function offsets() {
  const sh = st.shares, d = st.drop;
  const drop = [6 * d, 0, -14 * d];
  return {
    near: [0, 46 * sh[1], 0], far: [0, -46 * sh[1], 0], shaft: [0, 46 * sh[1] + 50 * sh[2], 0], top: [0, 0, 44 * sh[0]],
    booster: [-44 * sh[4], 0, 0], arm: [46 * sh[3], 0, 32 * sh[3]], drop,
  };
}
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const tr = (v) => translateAlong(P, v);
const crackPts = (len, OUT, off) => {
  const [z60, slope] = DATA.ZC, pts = [];
  const n = Math.max(2, Math.round(len * 14));
  for (let i = 0; i <= n; i++) {
    const x = 60 - (56 * len * i) / n;
    const jig = i === 0 || i === n ? 0 : (i % 2 ? 1.1 : -0.9) * (0.6 + 0.4 * Math.sin(i * 2.3));
    pts.push(iso(add([x, OUT + 0.2, z60 - (60 - x) * slope + jig], off), P));
  }
  return pathOf(pts);
};

// ---- render ----
let lastText = "";
function render() {
  const v = V(), OUT = DATA.IN_Y + v.t;
  // act 1
  const t = st.payT;
  const swipe = sstep(0.1, 1.1, t), paper = sstep(0.9, 2.4, t), regOut = sstep(2.5, 3.5, t), asmIn = sstep(3.3, 4.6, t);
  el.card.setAttribute("transform", tr([52 + 26 * swipe, 0, 0]));
  el.paper.innerHTML = paperSvg(30 * paper);
  const paid = t >= 1.15;
  el.l1.textContent = paid ? "已支付" : "尊享刹车体验";
  el.led.querySelector(".iso-dots").setAttribute("data-tone", paid ? "hi" : "faint");
  el.reg.setAttribute("transform", tr([150 * regOut, 0, 0]));
  el.reg.setAttribute("opacity", (1 - regOut).toFixed(3));
  el.reg.style.display = regOut >= 0.999 ? "none" : "";
  el.asm.setAttribute("transform", tr([0, 0, -46 * (1 - asmIn)]));
  el.asm.setAttribute("opacity", asmIn.toFixed(3));
  el.asm.style.display = asmIn <= 0.001 ? "none" : "";
  // act 2
  const o = offsets();
  for (const g of groups) {
    const on = g.dataset.v === variant;
    g.style.display = on ? "" : "none";
    if (!on) continue;
    const part = g.dataset.g;
    const base = part.startsWith("near") ? o.near : part.startsWith("far") ? o.far : o.shaft;
    g.setAttribute("transform", tr(part.endsWith("Upper") ? base : add(base, o.drop)));
  }
  el.top.setAttribute("transform", tr(o.top));
  el.booster.setAttribute("transform", tr(o.booster));
  const phi = DATA.PHI0 - (st.broken ? 0.24 + 0.30 * st.drop : pressOf(st.F));
  const arm = armParts(phi, add(o.arm, o.drop));
  el.arm.innerHTML = arm.svg;
  el.rod.innerHTML = solidSvg(bxRod(DATA.ROD_END, [arm.fork[0] - 2, arm.fork[1], arm.fork[2]], 3, P), { tone: "mid" }) + DATA.BOOT;
  const cd = st.crack > 0.01 ? crackPts(st.crack, OUT, o.near) : "";
  el.crack.setAttribute("d", cd); el.crack2.setAttribute("d", cd);
  const util = st.F / (v.fail);
  const stress = g0(variant, "nearUpper").querySelector('[data-part="stress"]');
  stress.setAttribute("opacity", (st.broken ? 0.5 : lim(util, 0, 1) ** 2 * 0.62).toFixed(3));
  el.needle.setAttribute("d", needleAt(st.F));
  el.marker.setAttribute("transform", tr([DATA.RULER.x0 + st.dist * DATA.RULER.perM, 0, 0]));
  // readouts
  const M = st.F * DATA.LEVER_M;
  let text, big, bigl, badge, status;
  if (st.phase !== "brake") {
    text = paid ? PAID_TEXT : PAY_TEXT; big = paid ? "已支付" : "¥1,000,000"; bigl = paid ? "¥1,000,000 · 示意，非真实支付" : "尊享刹车体验 · 按 Enter 付款";
    badge = "示意，非真实支付"; status = paid ? "已支付（示意）" : "待付款";
  } else {
    text = `F ${fmt(st.F)} N · M ${M.toFixed(1)} N·m`;
    big = st.broken ? "≈140 m" : `${fmt(st.F)} N`;
    bigl = st.broken ? `制动距离 ≈38 m → ≈140 m（报道）` : `根部弯矩 ${M.toFixed(1)} N·m`;
    badge = "示意值，非鉴定结论";
    status = st.broken ? `断裂（峰值 ${fmt(st.peak)} N）` : st.crack > 0.01 ? "根部开裂" : "完好";
  }
  const card = $o("pay"), btn = $o("paybtn");
  card.hidden = st.phase === "brake" || regOut >= 0.999;
  card.style.opacity = (1 - regOut).toFixed(3);
  btn.disabled = st.phase !== "pay";
  btn.textContent = st.phase === "pay" ? "付款" : paid ? "✓ 已支付" : "支付中…";
  $o("payamt").textContent = paid ? "已支付 ¥1,000,000" : "¥1,000,000";
  $o("payamt").toggleAttribute("data-paid", paid);
  $o("payhint").textContent = st.phase === "pay" ? "点击付款 · 或按 Enter" : paid ? "刹车体验即将开始" : "请稍候";
  $o("big").hidden = st.phase !== "brake";
  if (text !== lastText) { readout.textContent = text; lastText = text; }
  $o("bigv").textContent = big; $o("bigl").textContent = bigl;
  $o("big").toggleAttribute("data-red", st.broken);
  $o("badge").textContent = badge;
  $o("force").textContent = `${fmt(st.F)} N`;
  $o("moment").textContent = `${M.toFixed(1)} N·m`;
  $o("dist").textContent = `≈${Math.round(st.dist)} m`;
  $o("dist").toggleAttribute("data-red", st.broken);
  $o("status").textContent = status;
  $o("status").toggleAttribute("data-red", st.broken || st.crack > 0.01);
  $o("vname").textContent = v.name;
  for (const key of ["thin", "thick"]) {
    const bar = document.querySelector(`[data-bar="${key}"]`);
    const u = st.F / DATA.VARIANTS[key].fail;
    const shown = key === variant && st.broken ? 1 : u;
    bar.querySelector("i").style.width = `${lim(shown, 0, 1) * 100}%`;
    bar.querySelector("em").textContent = key === variant && st.broken ? "断裂" : `${Math.round(u * 100)}%`;
    bar.toggleAttribute("data-on", key === variant);
    bar.toggleAttribute("data-hot", key === variant && (st.broken || u >= DATA.VARIANTS[key].crack / DATA.VARIANTS[key].fail));
  }
  document.querySelectorAll("[data-preset]").forEach((b) => b.toggleAttribute("data-on", st.phase === "brake" && Math.round(st.Ft) === DATA.PRESETS[+b.dataset.preset].f));
  stage.setAttribute("aria-valuetext", text);
}
const g0 = (v, part) => groups.find((g) => g.dataset.v === v && g.dataset.g === part);

// ---- simulation ----
let demoT = 0, demoBrakeAt = -1, demoBrokeAt = -1;
function stepDemo(dt) {
  if (st.phase !== "brake") return; // never touches the payment act
  demoT += dt;
  if (demoBrakeAt < 0) demoBrakeAt = demoT;
  const s = demoT - demoBrakeAt;
  const plan = [[0.6, 250], [2.6, 500], [4.6, 1500], [6.6, 1612]];
  for (const [at, f] of plan) if (s >= at && s < at + dt + 0.0001) st.Ft = f;
  if (st.broken && demoBrokeAt < 0) demoBrokeAt = demoT;
  if (demoBrokeAt >= 0 && demoT - demoBrokeAt > 4.5) resetPedal();
}
// back to an intact, unloaded pedal without leaving the pedal act (demo loop)
function resetPedal() { const ex = st.exT; st = Object.assign(S0(), { phase: "brake", payT: 9, exT: ex, ex }); demoT = 0; demoBrakeAt = -1; demoBrokeAt = -1; }
function step(dt) {
  if (demo) stepDemo(dt);
  if (st.phase === "paying" && !frozen) { st.payT += dt; if (st.payT >= 4.6) st.phase = "brake"; }
  if (st.phase === "pay") st.payT = 0;
  if (st.phase === "brake") {
    const v = V();
    if (st.broken) st.Ft = 0;
    st.F = ease(st.F, st.Ft, dt, st.broken ? 0.12 : 0.42);
    if (Math.abs(st.F - st.Ft) < 0.5) st.F = st.Ft;
    st.peak = Math.max(st.peak, st.F);
    if (!st.broken) {
      const target = lim((st.F - v.crack) / (v.fail - v.crack), 0, 1);
      if (target > st.crack) st.crack = ease(st.crack, target + 0.02, dt, 0.28);
      st.crack = Math.min(1, st.crack);
      if (st.F >= v.fail && st.crack >= 0.97) { st.broken = true; st.crack = 1; }
    }
    // collapse: a spring that overshoots a little, like a part giving way
    const want = st.broken ? 1 : 0;
    if (still.matches) { st.drop = want; st.dropV = 0; }
    else for (let i = 0; i < 4; i++) { st.dropV += ((want - st.drop) * 260 - st.dropV * 18) * dt / 4; st.drop += st.dropV * dt / 4; }
    if (Math.abs(st.drop - want) < 1e-4 && Math.abs(st.dropV) < 1e-4) { st.drop = want; st.dropV = 0; }
    st.dist = ease(st.dist, st.broken ? 140 : 38, dt, 0.7);
    if (Math.abs(st.dist - (st.broken ? 140 : 38)) < 0.05) st.dist = st.broken ? 140 : 38;
  }
  // explode: six assemblies, staggered (top, near plate, shaft, arm, booster, far plate shares the near share)
  st.ex = ease(st.ex, st.exT, dt, 0.5);
  if (Math.abs(st.ex - st.exT) < 1e-3) st.ex = st.exT;
  st.shares = st.shares.map((_, i) => sstep(i * 0.09, 0.55 + i * 0.09, st.ex));
}
const busy = () => demo || st.phase === "paying" && !frozen || st.F !== st.Ft || (st.broken ? st.drop !== 1 || st.dist !== 140 : st.drop !== 0) || st.ex !== st.exT || (st.phase === "brake" && !st.broken && st.F > V().crack && st.crack < 0.97 * lim((st.F - V().crack) / (V().fail - V().crack), 0, 1));
let frame = 0, last = 0, visible = true;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  step(dt);
  render();
  frame = visible && busy() ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ---- actions ----
function pay() { if (st.phase !== "pay") return; st.phase = "paying"; st.payT = 0; frozen = false; userPaid = true; run(); }
function nudge() { const c = $o("pay"); c.removeAttribute("data-nudge"); void c.offsetWidth; c.setAttribute("data-nudge", ""); $o("paybtn").focus({ preventScroll: true }); }
function restart(keepDemo) { const ex = st.exT; st = S0(); st.exT = st.ex = ex ? 0 : 0; frozen = false; demoT = 0; demoBrakeAt = -1; demoBrokeAt = -1; if (!keepDemo) demo = false; run(); }
function setForce(f) { if (st.phase !== "brake" || st.broken) return; st.Ft = lim(f, 0, DATA.F_MAX); run(); }
function toggleVariant() { variant = variant === "thin" ? "thick" : "thin"; st.crack = 0; st.broken = false; st.dist = 38; st.peak = st.F; run(); }
let idle = 0;
function touched() { demo = false; clearTimeout(idle); if (!still.matches && q.get("demo") !== "0") idle = setTimeout(() => { if (!userPaid || st.phase !== "brake") return; resetPedal(); demo = true; run(); }, 20000); }
function act(name, arg) {
  touched();
  if (name === "pay") { if (st.phase === "pay") pay(); else if (st.broken) restart(); }
  if (name === "preset") { if (st.phase === "pay") nudge(); else setForce(DATA.PRESETS[arg].f); }
  if (name === "release") setForce(0);
  if (name === "variant") toggleVariant();
  if (name === "explode") { st.exT = st.exT ? 0 : 1; run(); }
  if (name === "restart") restart();
  render();
}
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key;
  const stepN = e.shiftKey ? 200 : 50;
  let used = true;
  if (key === "Enter") act("pay");
  else if (key === "ArrowRight" || key === "ArrowUp") { touched(); setForce(st.Ft + stepN); }
  else if (key === "ArrowLeft" || key === "ArrowDown") { touched(); setForce(st.Ft - stepN); }
  else if (/^[1-4]$/.test(key)) act("preset", +key - 1);
  else if (key === "0") act("release");
  else if (key === "b" || key === "B") act("variant");
  else if (key === "e" || key === "E") act("explode");
  else if (key === "r" || key === "R") act("restart");
  else used = false;
  if (used) e.preventDefault();
});
$o("paybtn").addEventListener("click", (e) => { e.stopPropagation(); act("pay"); });
$o("paybtn").addEventListener("pointerdown", (e) => e.stopPropagation());
document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act)));
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => act("preset", +b.dataset.preset)));
// drag the pedal: movement along the pad's travel on screen adds force
const padAt = (F) => iso(armParts(DATA.PHI0 - pressOf(F), [0, 0, 0]).pad, P);
const travel = (() => { const a = padAt(0), b = padAt(2000); const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; })();
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  touched();
  if (st.phase === "pay") { nudge(); return; }
  if (st.phase !== "brake") return;
  if (st.broken) return;
  drag = { x: e.clientX, y: e.clientY, f: st.Ft };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const box = svgEl.getBoundingClientRect();
  const s = svgEl.viewBox.baseVal.width / box.width;
  const along = ((e.clientX - drag.x) * travel[0] + (e.clientY - drag.y) * travel[1]) * s;
  touched();
  setForce(drag.f + along * 14);
});
const endDrag = () => { drag = null; };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
if (still.matches) demo = false;
// ?sim=seconds fast-forwards the simulation (fixed 60 Hz steps) and holds that frame, for headless screenshots
if (q.has("sim")) {
  const n = Math.round(+q.get("sim") * 60);
  for (let i = 0; i < n; i++) step(1 / 60);
  render();
} else {
  render();
  run();
}
</script></body></html>
